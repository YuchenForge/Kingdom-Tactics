services:
  postgres:
    image: postgres:15-alpine
    container_name: kingdom-tactics-postgres
    environment:
      POSTGRES_DB: kingdom_tactics
      POSTGRES_USER: kingdom_user
      POSTGRES_PASSWORD: kingdom_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingdom_user -d kingdom_tactics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kingdom-network

  # Start API first (or run Flyway once) so schema exists before worker ddl-auto: validate.
  # Local without image: mvn -pl api spring-boot:run, then mvn -pl worker spring-boot:run
  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    container_name: kingdom-tactics-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kingdom_tactics
      SPRING_DATASOURCE_USERNAME: kingdom_user
      SPRING_DATASOURCE_PASSWORD: kingdom_password
    restart: on-failure
    networks:
      - kingdom-network

volumes:
  postgres_data:

networks:
  kingdom-network:
    driver: bridge
