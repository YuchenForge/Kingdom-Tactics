services:
  postgres:
    image: postgres:15-alpine
    container_name: kingdom-tactics-postgres
    environment:
      POSTGRES_DB: kingdom_tactics
      POSTGRES_USER: kingdom_user
      POSTGRES_PASSWORD: kingdom_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingdom_user -d kingdom_tactics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kingdom-network

  redis:
    image: redis:7-alpine
    container_name: kingdom-tactics-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kingdom-network

volumes:
  postgres_data:

networks:
  kingdom-network:
    driver: bridge