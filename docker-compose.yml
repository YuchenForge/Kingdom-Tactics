# Local development defaults only; do not use these credentials in production.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kingdom_tactics
      POSTGRES_USER: kingdom_user
      POSTGRES_PASSWORD: kingdom_password
    ports:
      - "127.0.0.1:${KT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingdom_user -d kingdom_tactics"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kingdom_tactics
      SPRING_DATASOURCE_USERNAME: kingdom_user
      SPRING_DATASOURCE_PASSWORD: kingdom_password
      JWT_SECRET: local-compose-only-secret-change-before-production-1234567890
    ports:
      - "127.0.0.1:${KT_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kingdom_tactics
      SPRING_DATASOURCE_USERNAME: kingdom_user
      SPRING_DATASOURCE_PASSWORD: kingdom_password
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${KT_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
