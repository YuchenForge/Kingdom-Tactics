name: Multiplayer E2E

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: kt-e2e
      KT_WEB_PORT: 15173
      KT_API_PORT: 18080
      KT_DB_PORT: 15432
      E2E_BASE_URL: http://127.0.0.1:15173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build combined API/worker and frontend with a fresh database
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Test two-player browser flow
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p e2e-logs
          docker compose ps -a > e2e-logs/services.txt
          docker compose logs --no-color > e2e-logs/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiplayer-e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            e2e-logs/
          retention-days: 7
      - name: Remove disposable stack and database
        if: always()
        run: docker compose down --volumes --remove-orphans
