name: Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Matches backend/pom.xml java.version
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and build backend
        working-directory: backend
        # -B: batch mode. Reactor order builds api before worker (*IT + Flyway on classpath).
        # Docker is available on ubuntu-latest for Testcontainers; leave Ryuk enabled by default.
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports/
