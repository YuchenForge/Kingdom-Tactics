spring:
  application:
    name: kingdom-tactics-api
  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production!}
    expiration-ms: 86400000

---
# dev — local Docker Postgres
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/kingdom_tactics
    username: kingdom_user
    password: kingdom_password
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

---
# test — Testcontainers overrides datasource in @DynamicPropertySource
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.kingdom: DEBUG
